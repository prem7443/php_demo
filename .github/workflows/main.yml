name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy via SCP
        run: |
          scp -r -i your-key.pem * ec2-user@your-ec2-ip:/var/www/html/
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
